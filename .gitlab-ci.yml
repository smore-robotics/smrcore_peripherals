# ============================================
# rcore_peripherals GitLab CI/CD
# ============================================
#
# 与 rcore SDK 子仓库对齐：Linux x86 为主构建目标，armv8 由本地交叉编译脚本支持。

variables:
  BUILD_TYPE: "Release"
  U22_X86_BUILD_IMAGE: "git.smoa.cc:5050/robotics/packages/cross-build-env-u22:0.0.4"
  X86_BUILD_IMAGE: "git.smoa.cc:5050/robotics/packages/env-x86:0.0.2"

stages:
  - build
  - wheel
  - package

build:linux-x86:
  stage: build
  image: ${U22_X86_BUILD_IMAGE}
  variables:
    ARCH: "x86"
  script:
    - chmod +x ./scripts/build.sh ./scripts/run_tests.sh
    - ./scripts/build.sh -a ${ARCH} -t ${BUILD_TYPE} --with-sdk OFF --tests ON
    - ./scripts/run_tests.sh -t ${BUILD_TYPE}
  artifacts:
    name: "rcore_peripherals-cpp-linux-x86_64-${BUILD_TYPE}-${CI_COMMIT_SHORT_SHA}"
    when: always
    paths:
      - build_${BUILD_TYPE}/
    expire_in: 1 week
  tags:
    - public-docker

package:linux-x86:
  stage: package
  image: ${U22_X86_BUILD_IMAGE}
  needs: ["build:linux-x86"]
  dependencies:
    - build:linux-x86
  variables:
    ARCH: "x86"
  script:
    - chmod +x ./scripts/upload_artifacts.sh python/scripts/ci/*.sh
    - ./scripts/upload_artifacts.sh linux
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "master"'
  tags:
    - public-docker

python:wheel:
  stage: wheel
  image: ${X86_BUILD_IMAGE}
  tags:
    - public-docker
  needs:
    - job: build:linux-x86
      artifacts: true
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends curl ca-certificates file
    - python3 -m pip install --upgrade pip pytest
    - chmod +x ./scripts/build_py.sh ./scripts/run_test_py.sh python/scripts/*.sh python/scripts/ci/*.sh
  script:
    - ./scripts/build_py.sh -t ${BUILD_TYPE}
    - ./scripts/run_test_py.sh -t ${BUILD_TYPE}
  artifacts:
    name: "rcore_peripherals-py-linux-x86_64-${BUILD_TYPE}-${CI_COMMIT_SHORT_SHA}"
    when: always
    paths:
      - python/dist/*.whl
    expire_in: 1 week

package:python-wheel:
  stage: package
  image: ${X86_BUILD_IMAGE}
  tags:
    - public-docker
  needs:
    - job: python:wheel
      artifacts: true
  dependencies:
    - python:wheel
  script:
    - chmod +x ./python/scripts/upload_artifacts.sh python/scripts/ci/*.sh
    - ./python/scripts/upload_artifacts.sh
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "master"'
