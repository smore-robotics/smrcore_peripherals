[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "ninja>=1.11", "wheel"]
build-backend = "scikit_build_core.build"

[project]
name = "rcore-peripherals-py"
version = "0.1.0"
description = "Pybind11 Python bindings for rcore peripherals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "rcore" }]

[tool.scikit-build]
wheel.packages = ["src/rcore_peripherals"]
cmake.version = ">=3.20"
