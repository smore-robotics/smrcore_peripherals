name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # PR / manual runs build against the smrcore_sdk version pinned in .sdk-version.
  # download.sh tries the official v<version> release first, then falls back to
  # `prerelease` when that asset is not published yet. Official peripheral
  # releases are validated separately by release-smoke.yml.
  linux-peripherals-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            curl \
            g++ \
            ninja-build \
            python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install "conan>=2.0"

      - name: Check .sdk-version format
        run: |
          version="$(tr -d '[:space:]' < .sdk-version)"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo ".sdk-version must contain x.y.z, got: $version" >&2
            exit 1
          fi
          echo "SDK version: $version"

      - name: Download smrcore_sdk
        run: ./scripts/download.sh

      - name: Build C++ library, apps, and tests
        run: ./scripts/build.sh --with-sdk ON --tests ON

      - name: Run C++ unit tests
        run: ./scripts/run_tests.sh -t Release

      - name: Check C++ binaries
        run: |
          bin_dir="build_Release/install/bin"
          for name in \
            app_peripherals_probe \
            app_peripherals_read_spacemouse \
            app_peripherals_read_ft_sensor \
            app_peripherals_bridge; do
            test -x "$bin_dir/$name"
          done

      - name: Check SDK bridge linkage
        run: ldd build_Release/install/bin/app_peripherals_bridge | grep librcoresdk

      - name: Build Python wheel
        run: ./scripts/build_py.sh --no-install

      - name: Run Python unit tests
        run: ./scripts/run_test_py.sh -t Release

      - name: Check Python app scripts
        run: ./scripts/check_python_examples.sh

  # Pushes to main only run lightweight repo checks. Right after a PR merges,
  # the official smrcore_sdk release for .sdk-version may not exist yet, so
  # main must not depend on release assets.
  main-checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check .sdk-version format
        run: |
          version="$(tr -d '[:space:]' < .sdk-version)"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo ".sdk-version must contain x.y.z, got: $version" >&2
            exit 1
          fi
          echo "SDK version: $version"

      - name: Check shell scripts
        run: |
          for script in scripts/*.sh python/scripts/*.sh; do
            bash -n "$script"
          done

      - name: Check Python app scripts
        run: ./scripts/check_python_examples.sh

      - name: Compile Python tests
        run: |
          find python/tests -name '*.py' -print0 | xargs -0 python3 -m py_compile
