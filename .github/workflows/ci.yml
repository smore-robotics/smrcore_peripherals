name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vX.Y.Z tag"; exit 1; }
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
          [[ "$(cat .sdk-version)" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

  readers:
    needs: metadata
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    env:
      CI_COMMIT_TAG: ${{ needs.metadata.outputs.tag }}
      ASSET_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ patchelf
          python -m pip install 'conan>=2,<3' pytest numpy
      - name: Build readers and tests without robot SDK
        run: |
          ./scripts/build.sh --with-sdk OFF --tests ON
          ./scripts/run_tests.sh -t Release
          python -m pytest unittests/test_pico_legacy_release.py unittests/test_pico_stop_worker.py unittests/test_zhonglin.py unittests/test_pico_python_launcher.py -q
          ./scripts/check_python_examples.sh
      - name: Build and test wheel
        run: |
          ./scripts/build_py.sh --no-install
          ./scripts/run_test_py.sh -t Release
      - name: Package C++ readers
        if: matrix.python == '3.10'
        run: python scripts/package_release.py --install build_Release/install --output dist --version "$ASSET_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: readers-python-${{ matrix.python }}
          path: |
            python/dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  sdk-bridge:
    needs: metadata
    runs-on: ubuntu-22.04
    env:
      CI_COMMIT_TAG: ${{ needs.metadata.outputs.tag }}
      ASSET_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ curl
          python -m pip install 'conan>=2,<3'
      - name: Download exact official SDK release
        run: |
          export SDK_RELEASE_TAG="v$(cat .sdk-version)"
          ./scripts/download.sh
      - name: Build original SDK bridge and calibration apps
        run: |
          ./scripts/build.sh --with-sdk ON --with-pico OFF --tests OFF
          ldd build_Release/install/bin/app_peripherals_bridge | grep librcoresdk
      - name: Package bridge with SDK runtime and attribution
        run: |
          python scripts/package_release.py --install build_Release/install \
            --sdk-root third_party/smrcore_sdk --output dist --version "$ASSET_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-bridge-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  manual:
    needs: metadata
    runs-on: ubuntu-22.04
    env:
      ASSET_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-lang-chinese fonts-noto-cjk fonts-dejavu-core lmodern texlive-fonts-recommended
      - name: Build Chinese and English PDF and HTML manuals
        run: ./scripts/build_manual.sh dist "$ASSET_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: manuals
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, readers, sdk-bridge, manual]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          (cd dist && sha256sum *.tar.gz *.whl *.pdf *.html > SHA256SUMS)
          {
            echo "Robot SDK: $(cat .sdk-version)"
            echo
            echo "Linux x86_64 C++ readers, SDK bridge runtime, CPython 3.10–3.12 wheels, and bilingual manuals."
            echo "Pico dual-arm teleoperation is source-only pending the corrected official SDK package; it is not included in these binaries."
            echo "Built on Ubuntu 22.04. No hardware motion acceptance is implied."
          } > /tmp/release-notes.md
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "$RELEASE_TAG" --notes-file /tmp/release-notes.md --generate-notes
