name: Documentation site
on:
  push:
    branches: [main, feat/pico-readers-and-release]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r docs/requirements.txt
      - name: Build site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          export PERIPHERALS_SITE_URL="https://${OWNER}.github.io/${REPO}/"
          python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.repository == 'zhanhui-li-smore/smrcore_peripherals' && github.ref == 'refs/heads/feat/pico-readers-and-release'))
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
