name: Release Smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released peripherals version to verify (x.y.z or vx.y.z)"
        required: true

jobs:
  linux-release-smoke:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          version="${{ github.event.inputs.version }}"
          version="${version#v}"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must be x.y.z or vx.y.z, got: ${{ github.event.inputs.version }}" >&2
            exit 1
          fi
          echo "PERIPHERALS_VERSION=$version" >> "$GITHUB_ENV"

      # Verify the released assets against the examples as they were tagged.
      - name: Checkout release tag
        run: |
          git fetch --force origin "refs/tags/v${PERIPHERALS_VERSION}:refs/tags/v${PERIPHERALS_VERSION}"
          git checkout "v${PERIPHERALS_VERSION}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            curl \
            g++ \
            python3 \
            python3-pip

      - name: Resolve SDK version
        run: |
          sdk_version="$(tr -d '[:space:]' < .sdk-version)"
          if ! printf '%s\n' "$sdk_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo ".sdk-version must contain x.y.z, got: $sdk_version" >&2
            exit 1
          fi
          echo "SDK_VERSION=$sdk_version" >> "$GITHUB_ENV"

      - name: Download C++ packages
        run: ./scripts/download.sh

      - name: Build C++ examples
        run: ./scripts/build.sh

      - name: Check linked libraries
        run: |
          ldd build/bin/probe | grep libsmrcore_peripherals
          ldd build/bin/read_spacemouse | grep libsmrcore_peripherals
          ldd build/bin/read_ft_sensor | grep libsmrcore_peripherals
          ldd build/bin/peripherals_sdk | grep libsmrcore_peripherals
          ldd build/bin/peripherals_sdk | grep librcoresdk

      - name: Download Python wheels
        run: |
          PY_TAG=cp310-cp310-linux_x86_64
          curl -L --fail --show-error \
            "https://github.com/smore-robotics/smrcore_peripherals/releases/download/v${PERIPHERALS_VERSION}/rcore_peripherals_py-${PERIPHERALS_VERSION}-${PY_TAG}.whl" \
            -o "rcore_peripherals_py-${PERIPHERALS_VERSION}-${PY_TAG}.whl"
          curl -L --fail --show-error \
            "https://github.com/smore-robotics/smrcore_sdk/releases/download/v${SDK_VERSION}/rcore_sdk_py-${SDK_VERSION}-${PY_TAG}.whl" \
            -o "rcore_sdk_py-${SDK_VERSION}-${PY_TAG}.whl"

      - name: Install and verify Python wheels
        run: |
          python3 -m pip install \
            "./rcore_peripherals_py-${PERIPHERALS_VERSION}-cp310-cp310-linux_x86_64.whl" \
            "./rcore_sdk_py-${SDK_VERSION}-cp310-cp310-linux_x86_64.whl"
          python3 - <<'PY'
          import os

          import rcore_peripherals
          import rcore_sdk
          from rcore_sdk import _native

          peripherals_version = os.environ["PERIPHERALS_VERSION"]
          sdk_version = os.environ["SDK_VERSION"]

          assert rcore_peripherals.__version__ == peripherals_version

          info = _native.linked_sdk()
          print("peripherals:", rcore_peripherals.__version__)
          print("sdk:", info)
          assert rcore_sdk.__version__ == sdk_version
          assert info["linked"] is True
          assert info["version"] == sdk_version
          PY

      - name: Check Python examples
        run: ./scripts/check_python_examples.sh

  windows-release-smoke:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}".TrimStart("v")
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "version must be x.y.z or vx.y.z, got: ${{ github.event.inputs.version }}"
          }
          "PERIPHERALS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout release tag
        shell: pwsh
        run: |
          git fetch --force origin "refs/tags/v$env:PERIPHERALS_VERSION`:refs/tags/v$env:PERIPHERALS_VERSION"
          git checkout "v$env:PERIPHERALS_VERSION"

      - name: Resolve SDK version
        shell: pwsh
        run: |
          $sdkVersion = (Get-Content .sdk-version -Raw).Trim()
          if ($sdkVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw ".sdk-version must contain x.y.z, got: $sdkVersion"
          }
          "SDK_VERSION=$sdkVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download C++ packages
        shell: bash
        run: ./scripts/download.sh

      - name: Build C++ examples
        shell: pwsh
        run: |
          $prefix = "$pwd/third_party/smrcore_sdk;$pwd/third_party/smrcore_peripherals"
          cmake -S . -B build `
            -DCMAKE_PREFIX_PATH="$prefix" `
            -DSMRCORE_PERIPHERALS_BUILD_SDK_EXAMPLES=ON
          cmake --build build --config Release

      - name: Check C++ example outputs
        shell: pwsh
        run: |
          $examples = @(
            "probe",
            "read_spacemouse",
            "read_spacemouse_raw",
            "read_ft_sensor",
            "peripherals_sdk"
          )
          foreach ($example in $examples) {
            $path = "build/bin/Release/$example.exe"
            if (!(Test-Path $path)) {
              throw "Missing expected executable: $path"
            }
          }

      - name: Download Python wheels
        shell: pwsh
        run: |
          $pyTag = "cp310-cp310-win_amd64"
          $peripheralsAsset = "rcore_peripherals_py-$env:PERIPHERALS_VERSION-$pyTag.whl"
          $sdkAsset = "rcore_sdk_py-$env:SDK_VERSION-$pyTag.whl"
          curl.exe -L --fail --show-error `
            "https://github.com/smore-robotics/smrcore_peripherals/releases/download/v$env:PERIPHERALS_VERSION/$peripheralsAsset" `
            -o $peripheralsAsset
          curl.exe -L --fail --show-error `
            "https://github.com/smore-robotics/smrcore_sdk/releases/download/v$env:SDK_VERSION/$sdkAsset" `
            -o $sdkAsset

      - name: Install and verify Python wheels
        shell: pwsh
        run: |
          python -m pip install `
            ".\rcore_peripherals_py-$env:PERIPHERALS_VERSION-cp310-cp310-win_amd64.whl" `
            ".\rcore_sdk_py-$env:SDK_VERSION-cp310-cp310-win_amd64.whl"
          python -c "import os, rcore_peripherals, rcore_sdk; from rcore_sdk import _native; info = _native.linked_sdk(); print('peripherals:', rcore_peripherals.__version__); print('sdk:', info); assert rcore_peripherals.__version__ == os.environ['PERIPHERALS_VERSION']; assert rcore_sdk.__version__ == os.environ['SDK_VERSION']; assert info['linked'] is True; assert info['version'] == os.environ['SDK_VERSION']"

      - name: Check Python examples
        shell: pwsh
        run: |
          Get-ChildItem examples/python -Recurse -Filter *.py | ForEach-Object {
            python -m py_compile $_.FullName
          }
